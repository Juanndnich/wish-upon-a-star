<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Universe ✨</title>
    <!-- Import Font Estetis & Romantis -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Great+Vibes&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at 50% 30%, #200b30 0%, #0d0417 55%, #020005 100%);
            color: white;
            font-family: 'Montserrat', sans-serif;
        }

        /* START SCREEN */
        #startScreen {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, rgba(35, 12, 55, 0.85), rgba(2, 0, 5, 0.98));
            backdrop-filter: blur(12px);
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), visibility 1.2s;
        }

        #startScreen.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .start-card {
            width: min(90%, 400px);
            padding: 42px 30px;
            text-align: center;
            border: 1px solid rgba(255, 192, 203, 0.25);
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.04);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), 0 0 40px rgba(255, 105, 180, 0.18);
        }

        .start-icon {
            font-size: 54px;
            filter: drop-shadow(0 0 18px #ff4d8d);
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.12); opacity: 1; }
        }

        .start-card h1 {
            margin-top: 15px;
            font-family: 'Great Vibes', cursive;
            font-size: clamp(38px, 8vw, 54px);
            color: #ffc2d8;
            text-shadow: 0 0 20px rgba(255, 194, 216, 0.6);
        }

        .start-card p {
            margin-top: 8px;
            color: rgba(255, 255, 255, 0.72);
            font-size: 13px;
            letter-spacing: 1px;
            font-weight: 300;
        }

        #nameInput {
            width: 100%;
            margin-top: 25px;
            padding: 15px 18px;
            border: 1px solid rgba(255, 192, 203, 0.35);
            outline: none;
            border-radius: 14px;
            background: rgba(0, 0, 0, 0.45);
            color: #fff;
            font-size: 15px;
            text-align: center;
            font-family: inherit;
            transition: 0.3s;
        }

        #nameInput::placeholder { color: rgba(255, 255, 255, 0.35); }

        #nameInput:focus {
            border-color: #ff69b4;
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.4);
        }

        #startButton {
            width: 100%;
            margin-top: 16px;
            padding: 15px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            color: white;
            font-size: 14px;
            font-family: inherit;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ff4d8d, #b81473);
            box-shadow: 0 10px 30px rgba(255, 77, 141, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #startButton:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 35px rgba(255, 77, 141, 0.6);
        }

        /* CANVAS */
        #canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        /* CONTAINER PESAN & KARTU ROMANTIS */
        #contentWrapper {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            pointer-events: none;
            width: min(92%, 550px);
            opacity: 0;
            transition: opacity 2s ease;
        }

        #contentWrapper.show {
            opacity: 1;
        }

        .main-title {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(56px, 12vw, 115px);
            color: #ffffff;
            text-shadow: 0 0 15px #ff69b4, 0 0 35px #ff1493, 0 0 70px #b81473;
            line-height: 1;
        }

        .sub-name {
            display: block;
            margin-top: 8px;
            font-family: 'Caveat', cursive;
            font-size: clamp(26px, 5vw, 42px);
            color: #ffdeeb;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255, 182, 193, 0.9);
        }

        /* KARTU UCAPAN GLASSMORPHISM */
        .romantic-card {
            margin-top: 25px;
            padding: 22px 28px;
            border-radius: 20px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
            border: 1px solid rgba(255, 192, 203, 0.25);
            backdrop-filter: blur(8px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(255, 182, 193, 0.1);
            animation: floatCard 4s ease-in-out infinite alternate;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes floatCard {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-8px); }
        }

        .romantic-card p {
            font-family: 'Caveat', cursive;
            font-size: clamp(20px, 4vw, 27px);
            color: #fff0f6;
            line-height: 1.4;
            letter-spacing: 0.5px;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.8);
        }

        /* CURSOR KETIK BERKEDIP */
        .cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background-color: #ffb3d1;
            margin-left: 3px;
            vertical-align: middle;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="startScreen">
        <div class="start-card">
            <div class="start-icon">💖</div>
            <h1>A Special Wish</h1>
            <p>Masukkan namamu untuk membuka keajaiban malam ini...</p>
            <input id="nameInput" type="text" maxlength="22" placeholder="Tulis namamu di sini..." autocomplete="off">
            <button id="startButton">✨ Buka Hadiah</button>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <div id="contentWrapper">
        <div class="main-title">I Love You</div>
        <span class="sub-name" id="displayPath"></span>

        <div class="romantic-card">
            <p><span id="sweetText"></span><span class="cursor" id="cursor"></span></p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        let width, height;
        let dpr = Math.min(window.devicePixelRatio || 1, 1.5);

        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            canvas.style.width = width + "px";
            canvas.style.height = height + "px";
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            createBackgroundStars();
            createGlowParticles();
        }

        const random = (min, max) => Math.random() * (max - min) + min;
        const randomInt = (min, max) => Math.floor(random(min, max + 1));

        /* AUDIO SYNTHESIZER (AMBIENT PIANO/STRING SOUND) */
        function playRomanticMusic() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                const audioCtx = new AudioCtx();

                const notes = [261.63, 329.63, 392.00, 493.88, 523.25, 659.25]; // C, E, G, B, C, E
                let noteIndex = 0;

                function playNextNote() {
                    if (audioCtx.state === 'suspended') {
                        audioCtx.resume();
                    }

                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(notes[noteIndex % notes.length], audioCtx.currentTime);

                    gain.gain.setValueAtTime(0, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime + 0.8);
                    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 3.5);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start();
                    osc.stop(audioCtx.currentTime + 3.6);

                    noteIndex++;
                    setTimeout(playNextNote, 1600);
                }

                playNextNote();
            } catch (e) {
                console.log("Audio not supported or blocked");
            }
        }

        /* BACKGROUND STARS */
        const bgStars = [];
        function createBackgroundStars() {
            bgStars.length = 0;
            const count = Math.floor((width * height) / 3000);
            for (let i = 0; i < count; i++) {
                bgStars.push({
                    x: random(0, width),
                    y: random(0, height),
                    size: random(0.3, 1.5),
                    alpha: random(0.2, 0.85),
                    speed: random(0.3, 1.2),
                    phase: random(0, Math.PI * 2)
                });
            }
        }

        function drawBackgroundStars(time) {
            for (const star of bgStars) {
                const twinkle = star.alpha + Math.sin(time * 0.001 * star.speed + star.phase) * 0.25;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 230, 245, ${Math.max(0.05, Math.min(1, twinkle))})`;
                ctx.fill();
            }
        }

        /* FLOATING GLOW PARTICLES */
        const glowParticles = [];
        function createGlowParticles() {
            glowParticles.length = 0;
            for (let i = 0; i < 40; i++) {
                glowParticles.push({
                    x: random(0, width),
                    y: random(0, height),
                    size: random(1.5, 3.5),
                    vy: random(-0.2, -0.6),
                    vx: random(-0.2, 0.2),
                    alpha: random(0.3, 0.8),
                    color: ["#ff9ebb", "#ffd1dc", "#ffe3ec", "#ffd700"][randomInt(0, 3)]
                });
            }
        }

        function updateGlowParticles() {
            for (const p of glowParticles) {
                p.y += p.vy;
                p.x += p.vx;

                if (p.y < -10) p.y = height + 10;
                if (p.x < -10) p.x = width + 10;
                if (p.x > width + 10) p.x = -10;

                ctx.save();
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 8;
                ctx.fill();
                ctx.restore();
            }
        }

        /* DRAW HEART SHAPE */
        function drawHeart(x, y, size, color) {
            ctx.save();
            ctx.translate(x, y);
            ctx.beginPath();
            const s = size;
            ctx.moveTo(0, s * 0.35);
            ctx.bezierCurveTo(-s * 0.9, -s * 0.15, -s * 0.5, -s, 0, -s * 0.45);
            ctx.bezierCurveTo(s * 0.5, -s, s * 0.9, -s * 0.15, 0, s * 0.35);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.restore();
        }

        /* SHOOTING LOVE STARS */
        const shootingStars = [];
        let lastAutoSpawn = 0;

        function createShootingStar() {
            const startX = random(-200, width * 0.85);
            const startY = random(-100, height * 0.5);

            shootingStars.push({
                x: startX,
                y: startY,
                length: random(140, 260),
                speed: random(9, 15),
                angle: Math.PI / 4 + random(-0.05, 0.05),
                alpha: 1,
                size: random(7, 13),
                color: ["#ff69b4", "#ff1493", "#ffb6c1", "#ffffff", "#ff85a2", "#ffb3d1"][randomInt(0, 5)]
            });
        }

        function updateShootingStars(time) {
            if (time - lastAutoSpawn > random(120, 320)) {
                createShootingStar();
                lastAutoSpawn = time;
            }

            for (let i = shootingStars.length - 1; i >= 0; i--) {
                const s = shootingStars[i];
                s.x += Math.cos(s.angle) * s.speed;
                s.y += Math.sin(s.angle) * s.speed;
                s.alpha -= 0.008;

                if (s.alpha <= 0 || s.x > width + 200 || s.y > height + 200) {
                    shootingStars.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.beginPath();
                const tailX = s.x - Math.cos(s.angle) * s.length;
                const tailY = s.y - Math.sin(s.angle) * s.length;

                const grad = ctx.createLinearGradient(tailX, tailY, s.x, s.y);
                grad.addColorStop(0, "rgba(255, 105, 180, 0)");
                grad.addColorStop(0.6, `rgba(255, 182, 193, ${s.alpha * 0.5})`);
                grad.addColorStop(1, `rgba(255, 255, 255, ${s.alpha})`);

                ctx.strokeStyle = grad;
                ctx.lineWidth = s.size * 0.38;
                ctx.lineCap = "round";
                ctx.moveTo(tailX, tailY);
                ctx.lineTo(s.x, s.y);
                ctx.stroke();
                ctx.restore();

                drawHeart(s.x, s.y, s.size * s.alpha, s.color);
            }
        }

        /* EFEK KETIK (TYPING EFFECT) */
        const messageText = '"Di antara jutaan bintang di alam semesta, kamu adalah yang paling bersinar indah di mataku." ✨';
        let typeIndex = 0;
        const sweetTextEl = document.getElementById("sweetText");

        function typeWriter() {
            if (typeIndex < messageText.length) {
                sweetTextEl.textContent += messageText.charAt(typeIndex);
                typeIndex++;
                setTimeout(typeWriter, 55); // Kecepatan ketik (ms)
            }
        }

        /* MAIN LOOP */
        function animate(time) {
            ctx.clearRect(0, 0, width, height);

            drawBackgroundStars(time);
            updateGlowParticles();
            updateShootingStars(time);

            requestAnimationFrame(animate);
        }

        /* HANDLERS & EVENTS */
        const startScreen = document.getElementById("startScreen");
        const nameInput = document.getElementById("nameInput");
        const startButton = document.getElementById("startButton");
        const contentWrapper = document.getElementById("contentWrapper");
        const displayPath = document.getElementById("displayPath");

        function startExperience() {
            const userName = nameInput.value.trim() || "Bidadariku";
            displayPath.textContent = `~ ${userName} ~`;

            playRomanticMusic();
            startScreen.classList.add("hide");

            setTimeout(() => {
                contentWrapper.classList.add("show");
                setTimeout(typeWriter, 600); // Mulai mengetik setelah kartu muncul
            }, 800);
        }

        startButton.addEventListener("click", startExperience);
        nameInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") startExperience();
        });

        resizeCanvas();
        window.addEventListener("resize", resizeCanvas);
        requestAnimationFrame(animate);
    </script>
</body>
</html>
